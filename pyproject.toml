[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eh-batch-downloader"
version = "0.3.2"
description = "Standalone batch downloader GUI/CLI for E-Hentai and ExHentai."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
eh-batch = "eh_batch_downloader:main"
eh-batch-gui = "eh_batch_gui:main"

[tool.setuptools]
py-modules = ["eh_batch_downloader", "eh_batch_gui"]
